name: vLearning

options:
  bundleIdPrefix: com.darkopj
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16"
  generateEmptyDirectories: true

schemes:
  vLearning_iOS:
    build:
      targets:
        vLearning_iOS: all
    run:
      config: Debug
    archive:
      config: Release
  vLearning_macOS:
    build:
      targets:
        vLearning_macOS: all
    run:
      config: Debug
    archive:
      config: Release

configs:
  Debug: debug
  Release: release

# Settings shared by both targets via an xcconfig-style base
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: vLearning
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.darkopj.vlearning
    PRODUCT_NAME: vLearning
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[config=Debug]": DEBUG

targets:

  vLearning_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - vLearning
    info:
      path: vLearning/iOS-Info.plist
      properties:
        # Keep reading aloud with the screen locked or in another app.
        UIBackgroundModes: [audio]
    settings:
      base:
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  vLearning_macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - vLearning
      # The Python engine ships inside the Mac app; the app runs it on demand.
      - path: engine/server.py
        buildPhase: resources
    entitlements:
      path: vLearning/macOS.entitlements
      properties:
        # Off: the app launches the local Python engine and reads the Hugging Face model cache.
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: vLearning/macOS.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
