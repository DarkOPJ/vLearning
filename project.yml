name: vLearning

options:
  bundleIdPrefix: com.darkopj
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16"

configs:
  Debug: debug
  Release: release

targets:
  vLearning:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: vLearning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darkopj.vlearning
        PRODUCT_NAME: vLearning
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: vLearning
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: vLearning/macOS.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[config=Debug]: DEBUG
        TARGETED_DEVICE_FAMILY: "1,2"
